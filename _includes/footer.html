{% assign site_profile = site.data.site_profile %}

<div class="profile-footer">
  <p class="profile-footer__copyright">&copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }} · Academic profile</p>
  <nav class="profile-footer__links" aria-label="Footer">
    <a href="mailto:{{ site_profile.profile.email }}">Email</a>
    <a href="{{ site_profile.profile.scholar }}">Google Scholar</a>
    <a href="{{ site_profile.profile.orcid }}">ORCID</a>
  </nav>
</div>
