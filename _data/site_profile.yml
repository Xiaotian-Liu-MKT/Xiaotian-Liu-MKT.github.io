teaching:
  overview: >-
    Teaching across undergraduate and postgraduate digital marketing, market and consumer research,
    business analytics, and business research strategy. I connect research-informed marketing education
    with applied digital skills, analytics decision frameworks, experimentation, inclusive learning design,
    and industry-engaged assessment.
  roles:
    - course: MKTG3506 Digital Marketing and Social Media
      level: Undergraduate
      period: S1 2026
      detail: Delivered tutorials for approximately 60 students across two groups, covering digital strategy, social media, influencer marketing, SEO audit, customer experience, and campaign development.
      metric: Overall tutor rating 4.62/5
    - course: MKTG7510 Market and Consumer Research
      level: Postgraduate
      period: S1 2025 and S1 2026
      detail: Supported research design, attitudinal measurement, segmentation, SPSS and Qualtrics, and translation of data into applied insight; contributed to an industry-partnered, inclusive assessment redesign in 2026.
      metric: S1 2026 overall tutor rating 4.78/5
    - course: BSAN2204 Methods of Business Analytics
      level: Undergraduate
      period: S1 2026
      detail: Delivered tutorials for approximately 120 students across four groups, developing R programming, data manipulation, exploration, predictive modelling, and code optimisation capability.
      metric: Overall tutor rating 4.38/5
    - course: RBUS3900 Business Research Strategy
      level: Undergraduate
      period: S2 2026
      detail: Current teaching in business research strategy, research design, and evidence-based decision making.
    - course: BSAN4201 Business Analytics Strategy
      level: Undergraduate · Co-Lecturer
      period: S2 2026
      detail: Co-teaching a 64-student course; leading the 3-hour workshop across 5–6 weeks, supporting projects and assessments, and teaching data-to-decisions, experimentation, AI/data monetisation, and AI-enabled smart-service design.
  development: HEA@UQ Program — Associate Fellowship (AFHEA) application in preparation, aligned with PSF 2023 Descriptor 1.

