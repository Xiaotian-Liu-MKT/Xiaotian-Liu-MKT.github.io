profile:
  name: Xiaotian Liu
  role: Marketing scholar and PhD Candidate, The University of Queensland
  location: Brisbane, Australia
  email: xiaotian.liu@uq.edu.au
  scholar: https://scholar.google.com/citations?user=exW3X_YAAAAJ
  orcid: https://orcid.org/0000-0001-7580-5012
  linkedin: https://www.linkedin.com/in/xiaotian-liu-806379187/
  github: https://github.com/Xiaotian-Liu-MKT
  research_statement: >-
    I study how AI cues, platform design, recommendation interfaces, online auctions,
    immersive commerce, and marketplace claims shape consumer judgement and market outcomes.
    My work focuses especially on sustainable and prosocial behaviour, digital marketing,
    and AI-mediated service interactions.
  methods: Behavioural experiments, online and field studies, platform and secondary data, predictive modelling, and AI-assisted research workflows.
  doctoral_status: Written examiner reports received; oral examination scheduled for late August 2026; degree completion anticipated in 2026.

